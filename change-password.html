<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b45"><title>Change password | Nova Cares Pay Portal"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><style>
.password-card{width:min(100% - 32px,480px);margin:7vh auto;background:#fff;border:1px solid #e3e9ef;border-radius:18px;padding:clamp(25px,5vw,42px);box-shadow:0 20px 60px #142b4512}.brand{display:flex;align-items:center;gap:11px;color:#142b45;font:800 13px Manrope;letter-spacing:1.5px;margin-bottom:34px}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#142b45;color:#fff;font:800 20px Manrope}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.8px;color:#238b70}.password-card h1{font:800 27px/1.25 Manrope;color:#172c43;margin:10px 0}.password-card p{font-size:13px;line-height:1.7;color:#718096}.field{display:block;margin:20px 0 0;font-size:12px;font-weight:700;color:#33465a}.field input{display:block;width:100%;height:48px;margin-top:8px;padding:0 13px;border:1px solid #dce4eb;border-radius:9px;font:14px "DM Sans";outline:none}.field input:focus{border-color:#5c91b9;box-shadow:0 0 0 3px #315f9118}.submit-button{margin-top:25px}.message{min-height:20px;margin-top:13px;font-size:12px;line-height:1.5}.message.error{color:#b93838}.message.success{color:#238b70}.signout{display:block;margin:17px auto 0;border:0;background:none;color:#607d98;font:600 12px "DM Sans";cursor:pointer}.hint{font-size:11px!important;color:#8997a5!important;margin-top:18px}
</style></head><body><main class="password-card"><div class="brand"><span class="brand-mark">N</span><span>NOVA CARES<br><small style="font-size:9px;letter-spacing:2px;color:#8193a4">PAY PORTAL</small></span></div><div class="eyebrow">FIRST-TIME SIGN IN</div><h1>Create your new password</h1><p>Your administrator created your account. For security, please replace your temporary password before continuing to the portal.</p><form id="password-form"><label class="field" for="new-password">New password<input id="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required placeholder="At least 10 characters"></label><label class="field" for="confirm-password">Confirm new password<input id="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required placeholder="Enter the password again"></label><button class="submit-button" id="save-password" type="submit"><span>Save new password</span></button><div class="message" id="message" role="status" aria-live="polite"></div></form><p class="hint">Use at least 10 characters. Avoid reusing a password from another website.</p><button class="signout" id="sign-out" type="button">Sign out</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/change-password.js"></script></body></html>
