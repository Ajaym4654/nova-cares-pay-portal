<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b45"><title>Reset password | Nova Cares Pay Portal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><style>
.reset-card{width:min(100% - 32px,480px);margin:7vh auto;background:#fff;border:1px solid #e3e9ef;border-radius:18px;padding:clamp(25px,5vw,42px);box-shadow:0 20px 60px #142b4512}.reset-brand{display:flex;align-items:center;gap:11px;color:#142b45;font:800 13px Manrope;letter-spacing:1.5px;margin-bottom:34px}.reset-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#142b45;color:#fff;font:800 20px Manrope}.reset-card .eyebrow{font-size:10px;font-weight:700;letter-spacing:1.8px;color:#238b70}.reset-card h1{font:800 27px/1.25 Manrope;color:#172c43;margin:10px 0}.reset-card p{font-size:13px;line-height:1.7;color:#718096}.reset-field{display:block;margin:20px 0 0;font-size:12px;font-weight:700;color:#33465a}.reset-field input{display:block;width:100%;height:48px;margin-top:8px;padding:0 13px;border:1px solid #dce4eb;border-radius:9px;font:14px "DM Sans";outline:none}.reset-field input:focus{border-color:#5c91b9;box-shadow:0 0 0 3px #315f9118}.reset-card .submit-button{margin-top:25px}.reset-message{min-height:20px;margin-top:13px;font-size:12px;line-height:1.5}.reset-message.error{color:#b93838}.reset-message.success{color:#238b70}.reset-back{display:block;text-align:center;margin-top:18px;color:#607d98;font-size:12px;text-decoration:none}
</style></head><body><main class="reset-card"><div class="reset-brand"><span class="reset-mark">N</span><span>NOVA CARES<br><small style="font-size:9px;letter-spacing:2px;color:#8193a4">PAY PORTAL</small></span></div><div class="eyebrow">ACCOUNT RECOVERY</div><h1>Set a new password</h1><p>Choose a new password for your Nova Cares portal account.</p><form id="reset-form"><label class="reset-field" for="new-password">New password<input id="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required placeholder="At least 10 characters"></label><label class="reset-field" for="confirm-password">Confirm new password<input id="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required placeholder="Enter it again"></label><button class="submit-button" id="reset-button" type="submit"><span>Update password</span></button><div class="reset-message" id="reset-message" role="status" aria-live="polite"></div></form><a class="reset-back" href="/">Back to sign in</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/reset-password.js"></script></body></html>
